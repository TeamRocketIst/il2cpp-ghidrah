[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "il2cpp-ghidrah"
version = "0.2.0"
description = "Headless Ghidra pipeline for Unity IL2CPP applications"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "il2cpp-ghidrah contributors" }]
dependencies = []

[project.urls]
Repository = "https://github.com/TeamRocketIst/il2cpp-ghidrah"
Changelog = "https://github.com/TeamRocketIst/il2cpp-ghidrah/releases"

[project.scripts]
il2cpp-ghidrah = "il2cpp_ghidrah.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
il2cpp_ghidrah = ["ghidra_scripts/*.java"]

[tool.pytest.ini_options]
testpaths = ["tests"]
